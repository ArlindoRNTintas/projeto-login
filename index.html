<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Login</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,key"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/media-queries.css" media="screen" />
  </head>
  <body>
    <main>
      <section>
        <div id="logo">
          <picture>
            <source
              media="(max-width: 786px)"
              srcset="imgs/logowide.svg"
              type="image/svg+xml"
            />
            <img
              src="imgs/logosquare.svg"
              alt="Arlindo RN Tintas"
              type="image/svg+xml"
            />
          </picture>
        </div>
        <div id="divtexto">
          <h1>Login</h1>
          <p>Seja bem-vindo(a). Faça login para acessar.</p>
          <form action="login.php" autocomplete="on" method="post">
            <fieldset>
              <legend>Insira seus dados:</legend>
              <div class="divform">
                <label for="1user"
                  ><span class="material-symbols-outlined">
                    person
                  </span></label
                >
                <input
                  class="caixa"
                  type="text"
                  name="user"
                  id="1user"
                  autocomplete="username"
                  required
                  placeholder="  Seu Nome de Usuário"
                  minlength="6"
                  maxlength="20"
                />
              </div>
              <div class="divform">
                <label for="1senha"
                  ><span class="material-symbols-outlined"> key </span></label
                >
                <input
                  class="caixa"
                  type="password"
                  name="senha"
                  id="1senha"
                  autocomplete="current-password"
                  required
                  placeholder="  Sua Senha"
                  minlength="6"
                  maxlength="20"
                />
              </div>
            </fieldset>
            <input type="submit" value="Enviar"/>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
